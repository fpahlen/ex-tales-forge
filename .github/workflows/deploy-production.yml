# Deploy one commit of main to PRODUCTION (Fly app tales-forge).
#
# Two ways in (ex-tales-forge decisions 2026-10-09 "Deploy order: playtest
# first, then production" and "A fast deploy lane for admin work",
# docs/environments.md):
#
# 1. Normal lane, by hand. A merge to main deploys to playtest first
#    (.github/workflows/playtest.yml). Once Gentry (the QA bot) and the playtest
#    batch have checked that build and Fredrik has OK'd it, start this workflow
#    with the commit that was checked:
#
#      gh workflow run deploy-production.yml -R whyse-ab/ex-tales-forge -f sha=<full sha>
#
#    or Actions -> "Deploy to production" -> Run workflow.
#
# 2. Admin lane, automatically. playtest.yml calls this workflow (workflow_call,
#    lane=admin) right after its playtest deploy when every file changed since
#    the commit production runs is on the [admin] list in
#    .github/deploy-lanes.txt. No Gentry/batch gate and no prod OK; the same
#    "Verify commit" job runs, and the deploy job deploys only while the sha is
#    still the tip of main and production still runs the commit the lane was
#    picked against (production_base). Otherwise it skips with a notice.
#
# 3. Security lane, automatically (decision 2026-10-11 "Security-bump lane").
#    playtest.yml calls this workflow with lane=security after the playtest
#    deploy and a green smoke check, for a merged lock-only bump within the
#    major version that fixes an advisory. Same "Verify commit" job and the
#    same guard as the admin lane; no founder OK. The `deployed` output tells
#    playtest.yml to notify Bobby.
#
# The "Verify commit" job refuses a sha that is not a full 40-character sha,
# not on main, or whose Test and Dialyzer checks did not pass. By hand it warns
# (does not fail) when no successful playtest deploy of the sha is found.
#
# 4. Security rollback (lane=security-rollback, workflow_call only). Deploys the
#    sha in the tag `deployed/production-previous` while production still runs
#    production_base. No caller yet: the security-fix deploy calls it when the
#    production smoke check fails (off-hours security plan, PR c).
#
# After a successful deploy the tag `deployed/production` is moved to the sha:
# the admin lane diffs against it, so an admin merge never carries a game
# change that still waits for a founder's Approve. Before that, its old value
# goes to `deployed/production-previous` (not on a rollback), the rollback
# target.
#
# GitHub environment of the deploy job (picked by "Verify commit"):
# - `production-security` for the security and security-rollback lanes, but
#   only outside working hours (Mon-Fri 08:00-18:00 Europe/Stockholm) and only
#   for a run on main. It has no reviewer and allows only the branch main.
# - `production` for everything else: by hand, the admin lane, and the
#   security lanes during working hours. Its required reviewer (fpahlen)
#   approves every such deploy; bots never approve it.
#
# Needs FLY_API_TOKEN (a deploy token scoped to tales-forge) as an environment
# secret on both environments. The caller still passes it by name: the job's
# environment supplies the value.
name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit sha on main to deploy (the build checked on playtest)"
        required: true
        type: string
  workflow_call:
    inputs:
      sha:
        description: "Full 40-character commit sha on main to deploy"
        required: true
        type: string
      lane:
        description: "admin, security or security-rollback: the automatic lane"
        required: true
        type: string
      production_base:
        description: "The commit production ran when the lane was picked (deployed/production)"
        required: true
        type: string
    secrets:
      FLY_API_TOKEN:
        required: true
    outputs:
      deployed:
        description: "true when this run deployed the sha to production"
        value: ${{ jobs.deploy.outputs.deployed }}

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  verify:
    name: Verify commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.environment.outputs.name }}
    steps:
      # Full history of main, to check that the sha is on it.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: The sha is on main and CI passed for it
        env:
          SHA: ${{ inputs.sha }}
          LANE: ${{ inputs.lane || 'manual' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character lowercase commit sha, got '$SHA'."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main."
            exit 1
          fi
          for check in Test Dialyzer; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=$check&filter=latest" \
              --jq '.check_runs[0].conclusion // "missing"')"
            if [ "$conclusion" != "success" ]; then
              echo "::error::Required check '$check' for $SHA is '$conclusion', not success."
              exit 1
            fi
          done
          if [ "$LANE" = "security-rollback" ]; then
            git fetch --force origin "+refs/tags/deployed/production-previous:refs/tags/deployed/production-previous"
            previous="$(git rev-parse 'refs/tags/deployed/production-previous^{commit}')"
            if [ "$SHA" != "$previous" ]; then
              echo "::error::A rollback deploys only deployed/production-previous ($previous), got $SHA."
              exit 1
            fi
            echo "Security rollback: deploying $SHA (deployed/production-previous; on main; Test and Dialyzer passed)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$LANE" = "admin" ] || [ "$LANE" = "security" ]; then
            # Called from playtest.yml right after it deployed this sha to playtest
            # (security: and after the smoke check passed).
            echo "${LANE^} lane: deploying $SHA (on main; Test and Dialyzer passed; deployed to playtest in this run)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          playtest="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/playtest.yml/runs?head_sha=$SHA&status=success" \
            --jq '.total_count')"
          if [ "$playtest" = "0" ]; then
            echo "::warning::No successful 'Deploy to playtest' run found for $SHA. Was this build checked on playtest?"
          fi
          echo "Deploying $SHA (on main; Test and Dialyzer passed; playtest deploys found: $playtest)." >> "$GITHUB_STEP_SUMMARY"

      # production-security has no reviewer, so it is used only when nobody is
      # there to approve: security lanes, outside working hours, on main.
      - name: Pick the environment
        id: environment
        env:
          LANE: ${{ inputs.lane || 'manual' }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          day="$(TZ=Europe/Stockholm date +%u)"
          hour="$(TZ=Europe/Stockholm date +%H)"
          name=production
          if [ "$LANE" = "security" ] || [ "$LANE" = "security-rollback" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::notice::$REF is not main: environment production."
            elif [ "$day" -le 5 ] && [ "$((10#$hour))" -ge 8 ] && [ "$((10#$hour))" -lt 18 ]; then
              echo "::notice::Working hours in Stockholm: environment production (a founder approves)."
            else
              name=production-security
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Environment: \`$name\` (lane $LANE)." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ needs.verify.outputs.environment }}
    outputs:
      deployed: ${{ steps.done.outputs.deployed }}
    # Moves the deployed/production tag after the deploy.
    permissions:
      contents: write
    # One prod deploy at a time; a running deploy is never cancelled.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # Admin and security lanes only, checked inside the concurrency group so the answers are
      # current: deploy only the tip of main (same guard as playtest.yml), and
      # only if production still runs the commit the lane was picked against (a
      # deploy in between, by hand or a rollback, makes the lane stale).
      - name: Lane guard (tip of main, production unchanged)
        id: guard
        env:
          SHA: ${{ inputs.sha }}
          LANE: ${{ inputs.lane || 'manual' }}
          BASE: ${{ inputs.production_base }}
        run: |
          set -euo pipefail
          if [ "$LANE" != "admin" ] && [ "$LANE" != "security" ] && [ "$LANE" != "security-rollback" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          current="$(git ls-remote origin refs/tags/deployed/production | cut -f1)"
          reason=""
          # A rollback goes back on purpose, so only the base must be unchanged.
          if [ "$LANE" != "security-rollback" ] && [ "$SHA" != "$main_sha" ]; then
            reason="$SHA is not the tip of main (main is at $main_sha); production is not moved backwards. The tip gets its own lane when its CI passes."
          elif [ "$current" != "$BASE" ]; then
            reason="production moved from ${BASE:-unknown} to ${current:-unknown} since the lane was picked; deploy by hand if this build should go out."
          fi
          if [ -n "$reason" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production deploy skipped ($LANE lane)::$reason"
            {
              echo "${LANE^} lane: production deploy skipped. $reason"
              echo
              echo "A founder's Approve ships it by hand:"
              echo
              echo "    gh workflow run deploy-production.yml -f sha=$SHA"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "$SHA is the tip of main and production runs $BASE; deploying."
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@1.5
        if: steps.guard.outputs.deploy == 'true'

      # --depot=false: use Fly's classic remote builder. Every release so far was
      # built that way because Depot builds hung at "Waiting for depot builder"
      # for this org. Set the repo variable FLY_USE_DEPOT=true to try Depot again.
      - name: flyctl deploy
        if: steps.guard.outputs.deploy == 'true'
        # GIT_SHA: the commit goes into the image (Dockerfile), so the app knows it.
        # The script redeploys the same image once when the release machine
        # or the bluegreen green machine never starts.
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is empty: set it as a secret on the environment $ENVIRONMENT."
            exit 1
          fi
          .github/scripts/fly_deploy.sh
        env:
          ENVIRONMENT: ${{ needs.verify.outputs.environment }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_USE_DEPOT: ${{ vars.FLY_USE_DEPOT }}
          APP: tales-forge
          SHA: ${{ inputs.sha }}

      # The admin lane diffs against deployed/production (playtest.yml); a
      # security rollback deploys deployed/production-previous.
      - name: Record the deployed commit (tag deployed/production)
        if: steps.guard.outputs.deploy == 'true'
        env:
          SHA: ${{ inputs.sha }}
          LANE: ${{ inputs.lane || 'manual' }}
        run: |
          set -euo pipefail
          old="$(git ls-remote origin refs/tags/deployed/production | cut -f1)"
          git push --force origin "$SHA:refs/tags/deployed/production"
          echo "Deployed \`$SHA\` to production (tales-forge), lane: $LANE. Tag \`deployed/production\` moved to it." >> "$GITHUB_STEP_SUMMARY"
          # Not on a rollback: the bad build must not become the rollback target.
          if [ -n "$old" ] && [ "$old" != "$SHA" ] && [ "$LANE" != "security-rollback" ]; then
            if git fetch --no-tags --depth=1 origin "$old" && git push --force origin "$old:refs/tags/deployed/production-previous"; then
              echo "Tag \`deployed/production-previous\` moved to \`$old\` (the rollback target)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Could not move deployed/production-previous to $old: no rollback target for this deploy."
            fi
          fi

      - name: Deployed
        id: done
        if: steps.guard.outputs.deploy == 'true'
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"
