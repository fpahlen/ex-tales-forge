# CI for Tales Forge: format, Credo, tests with coverage, docs and Dialyzer on
# every PR, on every push to main and when dispatched (the health-history
# branch; ex-tales-forge docs/coding-standards.md).
# Test and Dialyzer are the required checks on main.
#
# Credo strict runs on all of lib/, admin files included (2026-10-11). The
# @spec check covers the backfilled files listed in .credo.exs. Dialyzer runs on
# the whole app. "Admin boundary" fails when game or shared code depends on an admin
# file (decision 2026-10-09 "A fast deploy lane for admin work").
#
# A push to main that passes Test and Dialyzer is deployed to PLAYTEST first
# (.github/workflows/playtest.yml), which also picks the merge's deploy lane: an
# admin-only merge goes on to production automatically; anything else waits for
# the manual .github/workflows/deploy-production.yml after the build has been
# checked on playtest and Fredrik has OK'd it (ex-tales-forge decision
# 2026-10-09 "Deploy order: playtest first, then production").
#
# "Dependency warnings" (not a required check, never fails) compiles the deps
# from scratch and lists their compiler warnings in its job summary: new ones
# first with a warning annotation, known ones (.github/dep-warnings-known.txt,
# each with a reason) collapsed below.
name: CI

on:
  pull_request:
    # The rolling "Code health history" PR changes only these two files.
    # GitHub makes a human approve every pull_request run on a PR that
    # github-actions[bot] opened (changelog 2026-06-11), so that PR gets its
    # Test and Dialyzer from a workflow_dispatch run instead, which
    # .github/workflows/health-snapshot.yml starts after each push. A PR
    # that also changes anything else still runs here.
    paths-ignore:
      - docs/health/history.csv
      - docs/health/trend.svg
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs of the same PR. Pushes to main get their own group per
# commit, so every commit on main is tested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with ELIXIR_VERSION / OTP_VERSION in the Dockerfile.
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "27.3.4.16"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
    services:
      # config/test.exs: postgres/postgres@localhost:5432, DB ex_tales_forge_test
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-

      - name: Install deps
        run: mix deps.get

      - name: Check for unused deps in mix.lock
        run: mix deps.unlock --check-unused

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      # Game and shared code must never depend on admin code: admin-only merges
      # reach production without Gentry or the playtest batch. Reads the lists in
      # .github/deploy-lanes.txt and the `mix xref graph` dependencies.
      - name: Admin boundary (game code never depends on admin code)
        run: mix deploy.check_boundaries


      - name: Credo
        run: mix credo --strict

      # Code health ratchet (docs/health/baseline.json): no new or bigger xref
      # cycles, no new lib/ex_tales_forge -> lib/ex_tales_forge_web references,
      # no new function over the Credo complexity/ABC limits, no score above
      # its ceiling. --base checks that the baseline itself only shrinks.
      - name: Code health ratchet
        run: |
          git fetch --depth=1 origin "${{ github.base_ref || 'main' }}"
          mix health.check --base FETCH_HEAD

      # Coverage: `mix test --cover` fails below the threshold in mix.exs
      # (test_coverage). The HTML report is uploaded as an artifact.
      - name: Test (with coverage)
        run: mix test --cover --warnings-as-errors

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover/
          if-no-files-found: ignore

      # ExDoc: the browsable docs site must build without warnings (broken
      # references in @doc/@moduledoc fail here).
      - name: Docs build
        run: mix docs --warnings-as-errors

      # Every internal link of the built site (pages, sidebar, search) resolves
      # under /admin/code-docs/, where the app serves it. No network: external
      # links are not fetched. The signed-in app pages and the docs viewer have
      # their own link tests (test/ex_tales_forge_web/link_crawl_test.exs,
      # admin/doc_live_test.exs) in the Test step above.
      - name: Docs link check
        run: mix docs.check_links doc

      - name: Hex audit (retired packages)
        run: mix hex.audit

  # Dialyzer (dialyxir) on the whole app. The PLT (deps + OTP) is cached by
  # mix.lock and OTP/Elixir version; building it from scratch takes a few
  # minutes, a cached run well under one. Accepted warnings, if any, live in
  # .dialyzer_ignore.exs.
  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-

      - name: Restore PLT cache
        id: plt-cache
        uses: actions/cache/restore@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-

      - name: Install deps
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Build PLT
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      # Saved even if the Dialyzer step below fails, so the next run is fast.
      - name: Save PLT cache
        if: steps.plt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: priv/plts
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}

      - name: Dialyzer
        run: mix dialyzer --format github

  # A report, not a gate: compiles every dep again (--force) so that each
  # warning is printed, then TalesForge.DepWarnings
  # (.github/scripts/dep_warnings.exs) lists them in the job summary. A warning
  # not in .github/dep-warnings-known.txt gets a warning annotation. The job
  # does not fail on warnings.
  dep_warnings:
    name: Dependency warnings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Read-only: the dep sources save a download; the compile below is forced.
      - name: Restore deps and _build
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-

      - name: Install deps
        run: mix deps.get

      - name: Compile deps (all warnings)
        run: mix deps.compile --force 2>&1 | tee deps-compile.log

      - name: Report dependency warnings
        run: elixir .github/scripts/dep_warnings.exs deps-compile.log .github/dep-warnings-known.txt

  # A workflow_dispatch run's own checks are not counted on a pull request
  # (GitHub counts only checks of push / pull_request-like runs), and check
  # runs made through the Checks API from a job join that same run. The
  # dispatched run on the health-history branch (see the pull_request
  # paths-ignore above) therefore sets commit statuses named Test and
  # Dialyzer on the branch head, with the outcome of its own jobs, so the
  # rolling PR gets its required checks with no approval. Only on
  # workflow_dispatch; a failed or cancelled job reports failure.
  report_dispatch:
    name: Report dispatched checks
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [test, dialyzer]
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Set the Test and Dialyzer statuses on the branch head
        env:
          GH_TOKEN: ${{ github.token }}
          TEST: ${{ needs.test.result }}
          DIALYZER: ${{ needs.dialyzer.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for pair in "Test:$TEST" "Dialyzer:$DIALYZER"; do
            name=${pair%%:*}
            result=${pair#*:}
            if [ "$result" = success ]; then state=success; else state=failure; fi
            gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f context="$name" -f state="$state" -f target_url="$RUN_URL" \
              -f description="Dispatched CI run: $name $result"
          done
