# The security lane's merge step (ex-tales-forge docs/decisions.md,
# 2026-10-11 "Security-bump lane"; .github/deploy-lanes.txt).
#
# Runs after every CI run of a pull request. When the PR qualifies
# (TalesForge.DeployLanes.Security, .github/scripts/security_lane.exs):
#   1. it changes only mix.lock, and optionally version pins in mix.exs deps,
#   2. every changed package keeps its major version (old and new mix.lock),
#   3. it has the label `security` or the title prefix `security:`, and an
#      advisory id (CVE-…, GHSA-…, EEF-CVE-…) in the title or body,
#   4. CI is green (Test and Dialyzer on the head sha),
# this workflow squash-merges it for exactly that head sha
# (`gh pr merge --squash --match-head-commit`). The push to main then runs CI
# and playtest.yml, which checks the same rules again on the merge, deploys
# playtest, runs the smoke check, deploys production for that sha and
# notifies Bobby.
#
# The security-fix lane (AGENTS.md rule 2 carve-out; TalesForge.DeployLanes.SecurityFix,
# .github/scripts/security_fix.exs merge): a mix.lock PR the security lane does
# not take is merged when it has the label `security-fix`, it is outside
# Mon-Fri 08:00-18:00 Stockholm, CI is green, it changes at most 10 files and
# 300 lines and no founder path but mix.exs/mix.lock, and a high or critical
# OSV advisory at the base version is gone at the head version.
# security-fix-deploy.yml deploys it after Gentry's qa/gentry-go.
#
# When a rule fails, the PR takes the normal lane (a founder's Approve). The
# run summary lists every rule with PASS or FAIL. PRs that do not change
# mix.lock end after one short step.
#
# Merging as the bot: a merge made with GITHUB_TOKEN does not trigger the CI
# run on main that starts the deploy. So the merge uses the same bot as
# security-audit.yml: SECURITY_BOT_APP_ID + SECURITY_BOT_APP_PRIVATE_KEY (a
# GitHub App, preferred) or SECURITY_BOT_TOKEN (a fine-grained PAT). The bot
# must be allowed to merge into main without a review (a bypass for the App in
# the main branch ruleset), because this lane has no founder OK.
#
# The auto lane (docs/design-auto-merge.md; TalesForge.DeployLanes.Auto,
# .github/scripts/auto_lane.exs): a PR that does not change mix.lock is merged
# by the bot when
#   1. no changed path is on [founder] in .github/deploy-lanes.txt (priv/,
#      SQL, mix.exs/mix.lock, fly*.toml, Dockerfile, rel/, config/, .github/,
#      docs/decisions.md),
#   2. it deletes nothing outside docs/ and test/,
#   3. it has no `user-visible` label (that label only adds founder review),
#   4. it is docs-only (every path under docs/) or health-history (branch
#      health-history, only docs/health/history.csv and trend.svg); refactors
#      wait for a Replay check in CI,
#   5. every check run and commit status on its head sha passed (success,
#      skipped or neutral), Test included.
# Anything else waits for a founder. The rules run from main, like the
# security lane's, and the merge is `--match-head-commit` for the sha that was
# checked. The bot is the whyse-merge-bot app (the secrets below).
#
# By hand (re-check one PR; a dry run unless dry_run=false):
#   gh workflow run security-lane.yml -f pr=<number>
#   gh workflow run security-lane.yml -f pr=<number> -f dry_run=false
name: Security lane

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to check"
        required: true
        type: string
      dry_run:
        description: "Only classify; never merge"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

env:
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "27.3.4.16"

jobs:
  classify:
    name: Merge lane check
    # pull_request CI runs, and the dispatched CI run of the health-history PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      lane: ${{ steps.fix.outputs.ok == 'true' && 'security-fix' || steps.security.outputs.lane || steps.auto.outputs.lane || 'normal' }}
      pr: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
    steps:
      - name: The pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PR:-}" ]; then
            number="$INPUT_PR"
          else
            number="$(gh pr list -R "$GITHUB_REPOSITORY" --state open --head "$HEAD_BRANCH" \
              --json number,headRefOid --jq "[.[] | select(.headRefOid == \"$HEAD_SHA\")][0].number // empty")"
          fi
          if [ -z "$number" ]; then
            echo "No open pull request with head \`${HEAD_SHA:-?}\`: nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr view "$number" -R "$GITHUB_REPOSITORY" \
            --json number,title,body,labels,headRefName,headRefOid,baseRefName,baseRefOid,files,isCrossRepository,state > "$RUNNER_TEMP/pr.json"
          jq '{title, body, labels, headRefName}' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-meta.json"
          head="$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")"
          if [ -n "${HEAD_SHA:-}" ] && [ "$head" != "$HEAD_SHA" ]; then
            echo "PR #$number moved on to \`$head\`; its own CI run decides." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$(jq -r '.baseRefName' "$RUNNER_TEMP/pr.json")" != "main" ] || \
             [ "$(jq -r '.isCrossRepository' "$RUNNER_TEMP/pr.json")" = "true" ] || \
             [ "$(jq -r '.state' "$RUNNER_TEMP/pr.json")" != "OPEN" ]; then
            echo "PR #$number: not an open PR from this repo into main. Normal lane." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # mix.lock: the security lane decides; anything else: the auto lane.
          lock=false
          if jq -e '[.files[].path] | index("mix.lock")' "$RUNNER_TEMP/pr.json" > /dev/null; then
            lock=true
          fi
          {
            echo "lock=$lock"
            echo "number=$number"
            echo "head=$head"
            echo "base=$(jq -r .baseRefOid "$RUNNER_TEMP/pr.json")"
          } >> "$GITHUB_OUTPUT"

      - name: CI is green (Test and Dialyzer on the head sha)
        id: ci
        if: steps.pr.outputs.lock == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          result=success
          for check in Test Dialyzer; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=$check&filter=latest" \
              --jq '.check_runs[0].conclusion // "missing"')"
            echo "$check: $conclusion"
            [ "$conclusion" = "success" ] || result=failure
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"

      # The auto lane: every check run and commit status on the head sha.
      - name: Checks on the head sha
        if: steps.pr.outputs.lock == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          runs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?filter=latest&per_page=100" \
            --jq '.check_runs[] | {name, status, conclusion}' | jq -s .)"
          statuses="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" \
            --jq '[.statuses[] | {name: .context,
                    status: (if .state == "pending" then "in_progress" else "completed" end),
                    conclusion: (if .state == "error" then "failure" elif .state == "pending" then null else .state end)}]')"
          jq -n --argjson runs "$runs" --argjson statuses "$statuses" '{checks: ($runs + $statuses)}' \
            > "$RUNNER_TEMP/checks.json"
          jq -r '.checks[] | "\(.name): \(.status) \(.conclusion)"' "$RUNNER_TEMP/checks.json"

      - uses: actions/checkout@v7
        if: steps.pr.outputs.number != ''
        with:
          fetch-depth: 0
          ref: main

      - uses: erlef/setup-beam@v1
        if: steps.pr.outputs.number != ''
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Runs the rules from main (not from the PR), so a PR cannot change them
      # for itself. Writes lane=security|normal and the PASS/FAIL list.
      - name: Security lane
        id: security
        if: steps.pr.outputs.lock == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
          CI: ${{ steps.ci.outputs.result }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/$PR" "$BASE"
          echo "#### PR #$PR" >> "$GITHUB_STEP_SUMMARY"
          elixir .github/scripts/security_lane.exs pr --base "$BASE" --head "$HEAD" \
            --pr "$RUNNER_TEMP/pr-meta.json" --ci "$CI"

      # Also from main: the security-fix lane, for a mix.lock PR the security
      # lane did not take. Writes ok=true|false and the rule list.
      - name: Security-fix lane
        id: fix
        if: steps.pr.outputs.lock == 'true' && steps.security.outputs.lane != 'security'
        env:
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
          CI_GREEN: ${{ steps.ci.outputs.result == 'success' }}
        run: |
          set -euo pipefail
          jq --argjson ci "$CI_GREEN" '{ref: ("refs/heads/" + .baseRefName), ci_green: $ci, labels: [.labels[].name]}' \
            "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/fix.json"
          elixir .github/scripts/security_fix.exs merge "$(git merge-base "$BASE" "$HEAD")" "$HEAD" "$RUNNER_TEMP/fix.json"

      # Also from main. Writes lane=auto|normal, class= and the rule list.
      - name: Auto lane
        id: auto
        if: steps.pr.outputs.lock == 'false'
        env:
          PR: ${{ steps.pr.outputs.number }}
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/$PR" "$BASE"
          echo "#### PR #$PR" >> "$GITHUB_STEP_SUMMARY"
          elixir .github/scripts/auto_lane.exs pr --base "$BASE" --head "$HEAD" \
            --pr "$RUNNER_TEMP/pr-meta.json" --checks "$RUNNER_TEMP/checks.json"

  merge:
    name: Squash-merge (merge lane)
    needs: classify
    # A dispatched run merges only with dry_run=false.
    if: >-
      contains(fromJSON('["security", "security-fix", "auto"]'), needs.classify.outputs.lane) &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HAS_APP: ${{ secrets.SECURITY_BOT_APP_ID != '' && secrets.SECURITY_BOT_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Bot token (GitHub App)
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SECURITY_BOT_APP_ID }}
          private-key: ${{ secrets.SECURITY_BOT_APP_PRIVATE_KEY }}

      - name: gh pr merge --squash --match-head-commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.SECURITY_BOT_TOKEN }}
          PR: ${{ needs.classify.outputs.pr }}
          HEAD: ${{ needs.classify.outputs.head }}
          LANE: ${{ needs.classify.outputs.lane }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No bot token (SECURITY_BOT_APP_ID/SECURITY_BOT_APP_PRIVATE_KEY or SECURITY_BOT_TOKEN): PR #$PR waits for a founder's Approve."
            echo "PR #$PR qualifies, but no bot token is set, so it waits for a founder's Approve (normal lane)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD"
          echo "Merged PR #$PR ($LANE lane, squash, head \`$HEAD\`). playtest.yml deploys it after CI on main." >> "$GITHUB_STEP_SUMMARY"
