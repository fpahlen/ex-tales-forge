# Code health history: after each merge to main, `mix health.snapshot` puts
# the merge's row in docs/health/history.csv and redraws trend.svg. The row
# goes to the branch `health-history` and one rolling PR; nothing is pushed
# to main. Merging that PR changes only those two files, which this
# workflow ignores, so it adds no row of its own. The PR's CI is a
# dispatched run (see the last step), so nobody has to approve it.
name: Health snapshot

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/health/history.csv
      - docs/health/trend.svg
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

# No concurrency group: GitHub keeps only one pending run per group and
# cancels the others, which dropped rows when merges came close together.
# Each run measures its own merge and retries the push instead.

env:
  # Keep in sync with ci.yml.
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "27.3.4.16"

jobs:
  snapshot:
    name: Snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
      BRANCH: health-history
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore deps and _build
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-

      - name: Install deps and compile
        run: mix deps.get && mix compile

      # The checkout is this merge, so this measures main's code at it.
      - name: Measure this merge
        run: |
          subject=$(git log -1 --format=%s "$GITHUB_SHA")
          pr=$(echo "$subject" | grep -o '#[0-9]*' | head -1 | tr -d '#')
          date=$(git log -1 --format=%cI "$GITHUB_SHA")
          mix health.snapshot ${pr:+--pr "$pr"} --date "$date" --out "$RUNNER_TEMP/row.csv"

      # Each attempt rebuilds the branch from the latest main: the branch
      # tip merged with origin/main, so every file but the two history files
      # is main's. GITHUB_TOKEN may not push a branch whose workflow files
      # differ from main's (no `workflows` permission): #345's run, which
      # merged its own older commit, failed so seconds after #346 changed
      # this file. If main moves before the push, or another run pushed
      # first, the push fails and the next attempt starts again from the new
      # heads (up to 5 times).
      - name: Put this merge's row on the rolling PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          subject=$(git log -1 --format=%s "$GITHUB_SHA")
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
              git fetch origin "$BRANCH"
              git switch -f -C "$BRANCH" "origin/$BRANCH"
              # If main changed the history files too (a new column, say),
              # take main's side and keep the branch's rows with --keep.
              keep="$RUNNER_TEMP/branch.csv"
              cp docs/health/history.csv "$keep"
              git merge --no-edit -X theirs origin/main
            else
              git switch -f -C "$BRANCH" origin/main
            fi
            # Only the history files may differ from main.
            git diff --quiet origin/main HEAD -- . ':(exclude)docs/health/history.csv' ':(exclude)docs/health/trend.svg' || {
              [ "$attempt" = 5 ] && exit 1
              continue
            }
            mix health.snapshot --row "$RUNNER_TEMP/row.csv" ${keep:+--keep "$keep"}
            git add docs/health/history.csv docs/health/trend.svg
            git commit -m "Code health row for $subject" || exit 0
            git push origin "$BRANCH" && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
          # CI skips pull_request runs on this PR (only the history files
          # change, see ci.yml), because GitHub would hold them for a
          # human's approval. A dispatched run needs none and gives the
          # branch head the required Test and Dialyzer checks.
          gh workflow run ci.yml --ref "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Code health history" \
              --body "Rows from \`mix health.snapshot\` after each merge to main. See docs/health/trend.svg."
          fi
