# Fly.io deployment stub — configure after Phase 1 deploy
app = "tales-forge"
primary_region = "iad"

[build]

[env]
  PHX_HOST = "tales-forge.fly.dev"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1