# Fly.io deployment for Tales Forge
app = "tales-forge"
primary_region = "arn"

# Graceful stop (card "Drafts survive a deploy"). Fly's default is SIGINT and
# 5 seconds, which ends the BEAM at once. SIGTERM starts the release's normal
# shutdown: the endpoint's socket drainer (TalesForgeWeb.Endpoint) tells every
# LiveView to reconnect, in batches, then open requests finish. 30 seconds is
# more than the drainer's 20.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

[deploy]
  release_command = "/app/bin/migrate"
  # Blue-green: Fly starts the new machine next to the old one, waits for its
  # /health check, moves the traffic, then stops the old machine. The
  # LiveViews reconnect to a machine that is already up, so a deploy is a
  # short reconnect and not a gap of 10 to 30 seconds. The second machine runs
  # only during the deploy (about a minute); production stays at one machine.
  strategy = "bluegreen"

[env]
  PHX_HOST = "tales-forge.fly.dev"
  PORT = "4000"
  # Fly private networking (.internal / .flycast) is IPv6-only
  ECTO_IPV6 = "true"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    # Public health endpoint; every other path needs a GitHub team sign-in.
    path = "/health"
    # force_ssl would 301 the plain-HTTP internal check; mark it as already HTTPS
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024"
  cpus = 1
